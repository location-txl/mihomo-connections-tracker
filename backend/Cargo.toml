[package]
edition = "2021"
name = "mihomo-connections-tracker"
version = "0.2.0"

[profile.release]
codegen-units = 1
incremental = false
lto = true
opt-level = "z"
panic = "abort"
strip = true

[dependencies]
chrono = {version = "0.4.45", features = ["serde"]}
clap = {version = "4.6.7", features = ["derive", "env"]}
futures-util = "0.3.34"
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.154"
sqlx = {version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "sqlite", "chrono"]}
tokio = {version = "1.54.1", features = ["full"]}
tokio-tungstenite = "0.30.0"
reqwest = { version = "0.13.5", features = ["json"] }
warp = { version = "0.4.3", features = ["server"] }

[dev-dependencies]
warp = { version = "0.4.3", features = ["test"] }
